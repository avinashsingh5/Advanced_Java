<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2 class="mb-4">Add New Book</h2>

<form th:action="@{/add-book}"
      th:object="${book}"
      method="post"
      class="col-md-6">

    <!-- Title -->
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control"/>
        <div class="text-danger" th:errors="*{title}"></div>
    </div>

    <!-- Author -->
    <div class="mb-3">
        <label class="form-label">Author</label>
        <input type="text" th:field="*{author}" class="form-control"/>
        <div class="text-danger" th:errors="*{author}"></div>
    </div>

    <!-- Price -->
    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
        <div class="text-danger" th:errors="*{price}"></div>
    </div>

    <button type="submit" class="btn btn-success">Save Book</button>
    <a th:href="@{/dashboard}" class="btn btn-secondary ms-2">Back</a>

</form>

</body>
</html>
